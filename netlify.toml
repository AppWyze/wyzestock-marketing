# Wyzestock marketing site (www.wyzestock.co.za): static HTML, no build step. Pages are generated by
# _build/build.py and committed. The _build folder is not linked from the site.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
