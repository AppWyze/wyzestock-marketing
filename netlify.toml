# Wyzestock marketing site (wyzestock.com; wyzestock.co.za redirects): static HTML, no build step. Pages are generated by
# _build/build.py and committed. The _build folder is not linked from the site.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 2026-10-26: wyzestock.com is the main address; every wyzestock.co.za page forwards to the same page on .com
# (permanent redirect, so search engines move the listing across). Netlify does not do this for a domain alias by itself.
[[redirects]]
  from = "https://wyzestock.co.za/*"
  to = "https://wyzestock.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wyzestock.co.za/*"
  to = "https://wyzestock.com/:splat"
  status = 301
  force = true
